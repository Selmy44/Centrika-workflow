<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
<title>Centrika OnePortal</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #FFFAE8; color: #0f172a; }
  .card { max-width: 420px; margin: 16px; padding: 32px 28px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 10px 30px rgba(15, 23, 42, .08); }
  img { width: 72px; height: 72px; }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { margin: 0 0 20px; color: #64748b; font-size: 14px; line-height: 1.5; }
  button { border: 0; border-radius: 12px; padding: 11px 20px; font-size: 14px; font-weight: 600; background: #3b6dae; color: #fff; cursor: pointer; }
  button:hover { background: #2d5a9e; }
  small { display: block; margin-top: 14px; color: #94a3b8; font-size: 12px; }
  /* After the light styles, so dark mode wins */
  @media (prefers-color-scheme: dark) {
    body { background: #0b1220; color: #e2e8f0; }
    .card { background: #111b2e; border-color: #1e293b; box-shadow: none; }
    p { color: #94a3b8; }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="build/icon.png" alt="" />
    <h1>Can't reach OnePortal</h1>
    <p>Check the internet connection. OnePortal will open again by itself as soon as it's back.</p>
    <button id="retry" type="button">Try again now</button>
    <small id="status">Retrying in 10 seconds…</small>
  </div>
  <script>
    const target = new URLSearchParams(location.search).get("url") || "https://oneportal.centrika.rw";
    const go = () => { location.href = target; };
    document.getElementById("retry").addEventListener("click", go);
    let left = 10;
    setInterval(() => {
      left -= 1;
      if (left <= 0) go();
      else document.getElementById("status").textContent = `Retrying in ${left} seconds…`;
    }, 1000);
    window.addEventListener("online", go);
  </script>
</body>
</html>

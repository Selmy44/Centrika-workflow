worker_processes auto;

# Store PID in /tmp (always writable)
pid /tmp/nginx.pid;


events {
    worker_connections 1024;
}

http {
    include  /etc/nginx/mime.types;
    default_type  application/octet-stream;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Disable logging to avoid permission issues
    access_log off;
    error_log /dev/stderr warn;

    # Optimize Static File Serving
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;


    # Gzip Compression for optimized delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    server {
        listen 8080;
        server_name _;

        # Root directory where the build files are.
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri  /index.html;
        }

        # Serve static files with long cache expiration
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, immutable";
        }

        # Handle React.js client-side routing
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }


        # Handle API Calls.
        location /api/ {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Timeouts for API calls
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_redirect off;
        }

        # Handle the backend related things.
        location /health {
            return 200 'The Nginx is healthy!';
            add_header Content-Type text/plain;
        }

    }
}